services:

  # =======================================================
  # APPLICATION
  # =======================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8097"

    volumes:
      - vector-storage:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy

    networks:
      - vector-network


  # =======================================================
  # MYSQL DATABASE
  # =======================================================
  db:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - vector-db-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USERNAME}",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - vector-network


# =========================================================
# NETWORK
# =========================================================
networks:
  vector-network:
    driver: bridge


# =========================================================
# VOLUMES
# =========================================================
volumes:
  vector-storage:
  vector-db-data: